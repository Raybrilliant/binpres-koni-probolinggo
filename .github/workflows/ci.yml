name: CI

on:
  push:
    branches: [backend]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Transpile check: tangkap error syntax/import tanpa perlu DB
      - name: Build check
        run: bun build ./src/index.ts --target=bun --outdir=dist

  docker:
    # push image ke DockerHub hanya saat push ke backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/backend'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/binpres-koni-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/binpres-koni-backend:${{ github.sha }}
